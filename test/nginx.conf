events {}

http {
    ssl_certificate     /certs/server.pem;
    ssl_certificate_key /certs/server.key;

    # proxy_set_header is repeated per location on purpose: any proxy_set_header in a
    # block drops all inherited ones, and the cert headers must differ per host.
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;

    # Main login host: no device mTLS. Strip cert headers so clients can't forge them.
    server {
        listen 8443 ssl;
        server_name idp.localhost;

        location / {
            proxy_pass http://keycloak:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  8443;
            proxy_set_header ssl-client-cert   "";
            proxy_set_header ssl-client-verify "";
        }
    }

    # Device host: asks for a cert from the device CA only, forwards it verified.
    server {
        listen 8443 ssl;
        server_name device.localhost;

        ssl_client_certificate /certs/device-ca.pem;
        ssl_verify_client      optional;
        ssl_verify_depth       2;

        location / {
            proxy_pass http://keycloak:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  8443;
            proxy_set_header ssl-client-cert   $ssl_client_escaped_cert;
            proxy_set_header ssl-client-verify $ssl_client_verify;
        }
    }
}
